[project]
name = "flame-in-freefall"
version = "0.1.0"
description = "Structured-first hybrid RAG over NASA/JAXA microgravity combustion experiment data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Flame in Freefall contributors" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flame"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["flame"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/flame"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=flame --cov-report=term-missing"
markers = ["integration: tests that exercise more than one module"]
pythonpath = ["."]

[tool.coverage.run]
source = ["flame"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
