services:
  api:
    build: .
    env_file: .env
    depends_on: [qdrant]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on: [api]
    restart: unless-stopped
volumes:
  qdrant_data:
