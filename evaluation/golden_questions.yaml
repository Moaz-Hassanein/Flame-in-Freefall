    physical definitions: droplet regression rate in FLEX/FLEX-2 (d(d^2)/dt), concurrent
    or opposed flame spread rate along solid slabs/fabrics in BASS/SAFFIRE/FLARE,
    regression rate in smoldering foam in MGM, and burning rate emulator burner rates
    in ACME. Cross-family aggregation is invalid without per-family definition checking.'
  caveats:
  - documented in docs/data_dictionary.md and compiler warning rules
  needs_expert: false
  expected_experiment_ids: []
