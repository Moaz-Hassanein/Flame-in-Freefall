  expected_answer: Campaign date ranges represent multi-year testing windows rather
    than discrete ISO 8601 test dates. The pipeline sets test_date to null and applies
    the TEST_DATE_CAMPAIGN_RANGE flag to prevent temporal filtering errors, while
    preserving the original string in test_date_raw.
